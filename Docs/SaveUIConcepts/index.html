<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Windows 求生 · 四版 UI 方案</title>
<style>
:root{color-scheme:dark;--mint:#64deae;--line:#414745;--muted:#a9b0ac}*{box-sizing:border-box}body{margin:0;background:#141716;color:#ecefec;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header,main{max-width:1600px;margin:auto;padding:28px 36px}header{padding-bottom:16px}h1{font-size:28px;margin:6px 0 8px;font-weight:600}p{margin:8px 0;color:var(--muted)}small{color:var(--muted)}.eyebrow{font-size:12px;letter-spacing:2px;color:var(--mint)}.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:16px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.group{display:flex;gap:8px;flex-wrap:wrap}button,a.control{font:inherit;border:1px solid var(--line);border-radius:5px;background:transparent;color:inherit;padding:8px 16px;cursor:pointer;text-decoration:none}button:hover,a.control:hover{background:#262c29;border-color:#9aaba2}button[aria-pressed=true]{color:var(--mint);border-color:var(--mint);background:#1d2c24}.grid{display:grid;grid-template-columns:1fr 1fr;gap:24px}.card{border:1px solid var(--line);background:#191c1a;border-radius:8px;overflow:hidden}.card h2{font-size:20px;margin:16px 20px 4px}.card p{margin:0 20px 16px;font-size:14px}.card img{display:block;width:100%;height:auto;cursor:zoom-in}.card .actions{padding:12px 20px;display:flex;gap:8px;align-items:center}.card .actions button{font-size:14px}.single{grid-template-columns:1fr}.single .card{max-width:1440px;margin:auto;width:100%}.guide{margin:20px 0 24px}.foot{margin:28px 0 16px;font-size:14px}.tag{font-family:monospace;color:var(--mint);padding-right:10px}.page-note{font-size:14px;margin-bottom:20px}dialog{max-width:98vw;width:1920px;padding:0;background:#111;border:1px solid #717874;color:white}dialog::backdrop{background:#000c}dialog img{display:block;width:100%}dialog .close{position:sticky;top:0;display:flex;justify-content:space-between;padding:10px 16px;background:#1c201d}dialog .close button{padding:3px 14px}@media(max-width:850px){.grid{grid-template-columns:1fr}header,main{padding:20px}h1{font-size:24px}}
</style></head><body>
<header><div class="eyebrow">WINDOWS 求生 / UI DESIGN STUDIES</div><h1>四种布局，同一套游戏素材</h1><p>先选布局与操作方式。每版包含保存记录、创建世界线、设置三页；框体、标题栏、按钮、字体与地点图标均来自当前工程。</p><div class="toolbar"><div class="group" id="variants"><button data-v="all" aria-pressed="true">四版并排</button><button data-v="A">A 档案列表</button><button data-v="B">B 航行日志</button><button data-v="C">C 桌面双窗口</button><button data-v="D">D 保存点卡片</button></div><div class="group" id="pages"><button data-p="saves" aria-pressed="true">保存记录</button><button data-p="creation">创建世界线</button><button data-p="settings">设置</button></div></div></header>
<main><p style="margin-bottom:24px"><a class="control" href="motion/">已选 B · 查看三套可交互动态设计稿 →</a></p><p class="page-note">Unity 实际素材排版预览 · 示例存档 · 尚未接入存档交互。点击图片可放大；上方可切换三种页面。</p><div id="gallery" class="grid"></div><p class="foot">你可以直接回复 A / B / C / D，也可以组合，例如「C 的双窗口 + A 的记录列表」。绿色仅标识选中项和主要操作，所有操作按钮默认显示边框。</p></main>
<dialog id="zoom"><div class="close"><span id="zoomTitle"></span><button id="close">关闭 ×</button></div><img id="zoomImage" alt="方案大图"></dialog>
<script>
const variants={A:{name:'档案列表',desc:'地点、游戏时间、保存类型按列对齐。记录密度高，适合频繁回档和管理大量保存点。',flow:'创建页采用表单；设置页采用顶部标签。'},B:{name:'航行日志',desc:'按游戏日期分组，当前记录展开。重点突出“哪一天、哪一次”，阅读节奏更舒展。',flow:'创建页以名称与模式卡片为主；设置页按内容段落组织。'},C:{name:'桌面双窗口',desc:'左窗选择世界线，右窗查看时间点。沿用游戏多窗口桌面的使用方式，切换世界线时保留列表。',flow:'创建和设置延续独立导航窗 + 内容窗。'},D:{name:'保存点卡片',desc:'地点图标配合卡片网格，一屏显示六个时间点。容易扫视，记录较多时需要更多滚动。',flow:'创建页突出模式卡片；设置页使用较大的分类按钮。'}};
const titles={saves:'保存记录',creation:'创建世界线',settings:'设置'};let current='all',page='saves';const gallery=document.querySelector('#gallery');
function render(){document.querySelectorAll('[data-v]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===current)));document.querySelectorAll('[data-p]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.p===page)));gallery.className=current==='all'?'grid':'grid single';gallery.innerHTML='';(current==='all'?Object.keys(variants):[current]).forEach(id=>{const item=variants[id],card=document.createElement('article');card.className='card';card.innerHTML=`<h2><span class="tag">${id}</span>${item.name}</h2><p>${page==='saves'?item.desc:item.flow}</p><img src="${id}-${page}.png" alt="${id} ${item.name} ${titles[page]}" loading="eager"><div class="actions"><button class="enlarge">放大查看</button><button class="focus">只看这一版</button><small>${titles[page]} / 1920 × 1080</small></div>`;const open=()=>{document.querySelector('#zoomTitle').textContent=`${id} · ${item.name} · ${titles[page]}`;document.querySelector('#zoomImage').src=`${id}-${page}.png`;document.querySelector('#zoom').showModal()};card.querySelector('img').onclick=open;card.querySelector('.enlarge').onclick=open;card.querySelector('.focus').onclick=()=>{current=id;render()};gallery.append(card)})}
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{current=b.dataset.v;render()});document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{page=b.dataset.p;render()});document.querySelector('#close').onclick=()=>document.querySelector('#zoom').close();document.querySelector('#zoom').onclick=e=>{if(e.target===e.currentTarget)e.currentTarget.close()};render();
</script></body></html>
