<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>B 航行日志 · 交互设计稿</title><link rel="stylesheet" href="motion.css"><link rel="stylesheet" href="quiet-frame.css?v=3"></head>
<body data-motion="quiet"><header class="workbench"><div class="intro"><span class="eyebrow">B / 航行日志 · 交互设计稿</span><h1>同一版布局，三种操作手感</h1><p>使用游戏原有框体、字体与地点图标。可实际点击体验；所有数据均为演示，不修改游戏存档。</p></div><nav class="presets" aria-label="动效方案"><button data-preset="quiet" aria-pressed="true">B1 克制描边 <small>推荐</small></button><button data-preset="mechanical" aria-pressed="false">B2 机械按键</button><button data-preset="signal" aria-pressed="false">B3 信号标记</button></nav><div class="work-controls"><nav aria-label="预览页面"><button data-page="saves" aria-pressed="true">保存记录</button><button data-page="create" aria-pressed="false">创建世界线</button><button data-page="settings" aria-pressed="false">设置</button></nav><div><button id="play-demo">播放一轮反馈</button><button id="reopen" hidden>重新打开窗口</button><label class="reduced"><input id="reduce" type="checkbox">减少动态效果</label></div></div><p id="demo-step" aria-live="polite">试试：悬停按钮 → 按住 → 选择另一条记录 → 读取。Tab / Enter / Esc 也可以操作。</p></header>
<main class="study"><section id="game" class="game" aria-label="可交互游戏界面"><div id="shell" class="shell"><header class="titlebar"><span class="title-icon" aria-hidden="true">▣</span><span id="window-title">航行日志</span><button id="window-close" class="ui-btn close-btn" aria-label="关闭预览窗口"><span class="face">×</span></button></header><div id="page-host"></div><div id="toast" role="status" aria-live="polite"></div></div></section>
<aside class="notes"><span class="eyebrow" id="scheme-number">B1</span><h2 id="scheme-name">克制描边</h2><p id="scheme-description"></p><dl id="specs"></dl><h3>状态对照</h3><p class="minor">停留、按压、选中采用不同反馈。</p><div class="state-row"><span>默认</span><button class="ui-btn sample" tabindex="-1"><span class="face">读取记录</span></button></div><div class="state-row"><span>悬停</span><button class="ui-btn sample demo-hover" tabindex="-1"><span class="face">读取记录</span></button></div><div class="state-row"><span>按下</span><button class="ui-btn sample demo-hover demo-press" tabindex="-1"><span class="face">读取记录</span></button></div><div class="state-row"><span>选中</span><button class="ui-btn sample primary chosen" tabindex="-1"><span class="face">已选择</span></button></div><div class="state-row"><span>禁用</span><button class="ui-btn sample" disabled><span class="face">无法读取</span></button></div><div class="state-row"><span>处理中</span><button class="ui-btn sample sample-loading" disabled><span class="face">读取中…</span><i class="load-line"></i></button></div><h3>细节原则</h3><ul><li>文字不放大，像素保持清晰。</li><li>悬停不会改变点击区域。</li><li>快速切换时动效从当前状态衔接。</li><li>危险操作有独立确认，禁用项不响应。</li></ul><a href="../index.html">返回布局方案</a></aside></main>
<dialog id="confirm" class="shell confirm"><form method="dialog"><header class="titlebar">确认操作</header><div class="confirm-body"><h2 id="confirm-title"></h2><p id="confirm-copy"></p><div class="confirm-actions"><button value="cancel" class="ui-btn"><span class="face">取消</span></button><button id="confirm-yes" value="yes" class="ui-btn danger"><span class="face">确认删除</span></button></div></div></form></dialog><script src="motion.js?v=2"></script></body></html>
