<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>设置窗口 · 三版设计稿</title><link rel="icon" href="data:,"><link rel="stylesheet" href="style.css"></head>
<body>
<header class="workbench"><div><span class="eyebrow">WINDOWS 生存 / UI STUDY</span><h1>设置窗口 · 布局提案</h1><p>使用现有框体、字体和地点图。示例数据，仅预览。</p></div><nav aria-label="设计方案"><button data-scheme="A">A · 双栏面板</button><button data-scheme="B">B · 侧栏设置</button><button data-scheme="C">C · 紧凑菜单</button></nav><button id="long-name">试用长名称</button></header>
<main><section id="stage" aria-label="设计稿"><div class="stage-caption"><span id="scheme-caption"></span><span>设置 / 游戏</span></div><div id="window-host"></div><div class="stage-bottom"><span>现有 UI 素材 · 单层边框 · 少量薄荷绿</span><span>布局设计稿 / 非游戏运行画面</span></div></section>
<section class="design-notes"><div><span class="eyebrow">布局重点</span><h2 id="scheme-title"></h2><p id="scheme-note"></p></div><div><span class="eyebrow">交互共用规范</span><p>悬停：原边框提亮，底色保持不变。<br>按下：文字下沉 1 px，松开复位。<br>分类切换：内容淡入；窗口尺寸保持稳定。</p></div><div><span class="eyebrow">可试操作</span><p>切换方案和设置分类；点击保存、读取或退出。<br>退出会出现二次确认，读取先显示保存点列表。<br>此处操作不影响游戏存档。</p></div></section></main>
<script src="script.js"></script></body></html>
